<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="昇銓建材網站暫停公開，待相關圖片素材正式取得並確認授權後，將重新設計並開放。">
<title>昇銓建材｜網站暫停公開</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f4ef;color:#25332d;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;padding:28px}main{width:min(100%,660px);padding:54px 44px;border:1px solid #dedfd5;border-radius:18px;background:#fffefb;box-shadow:0 12px 44px #25332d08}.label{display:inline-block;padding:7px 13px;border:1px solid #dbe0d4;border-radius:999px;background:#f1f3ed;color:#52624e;font-size:14px;letter-spacing:.08em}h1{margin:28px 0 10px;font-size:clamp(30px,6vw,42px);letter-spacing:.12em;font-weight:700}h2{margin:0 0 24px;font-size:21px;font-weight:500;color:#52624e}p{margin:0;max-width:34em;font-size:17px;line-height:1.95;color:#58615b}.rule{width:42px;height:2px;background:#b2bea7;margin:30px 0}.note{font-size:14px;color:#72796e}@media(max-width:480px){body{padding:20px}main{padding:36px 25px;border-radius:14px}p{font-size:16px}}
</style>
</head>
<body>
<main>
<span class="label">暫不對外開放</span>
<h1>昇銓建材</h1>
<h2>網站暫停公開</h2>
<p>待相關圖片素材正式取得並確認授權後，將重新設計並開放。</p>
<div class="rule" aria-hidden="true"></div>
<p class="note">感謝您的理解。</p>
</main>
</body>
</html>
