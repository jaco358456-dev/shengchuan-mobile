<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品分類 — 昇銓建材</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-hero {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
        }
        .product-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .product-hero .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.85) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 80px 24px 60px;
            text-align: center;
        }
        .product-hero h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 10px;
            margin-bottom: 20px;
        }
        .product-hero p {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            line-height: 2;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="star-cera-logo.png" alt="STAR CERA 昇銓建材">
        </div>
        <button class="hamburger" onclick="openMenu()">
            <span></span><span></span><span></span>
        </button>
    </header>

    <nav class="side-menu" id="sideMenu">
        <button class="close-btn" onclick="closeMenu()">&times;</button>
        <a href="index.html">首頁</a>
        <a href="about.html">關於昇銓</a>
        <a href="products.html">產品中心</a>
         <a href="careers.html">徵才專區</a>
         <a href="contact.html">聯絡我們</a>
    </nav>

    <!-- 產品分類 -->
    <section class="product-hero">
        <img src="hero/slider18.jpg" alt="產品分類總覽">
        <div class="overlay">
            <h1>產品分類</h1>
            <p>
                昇銓磁磚，涵蓋多個產品分類，300+ 款瓷磚產品。<br>
                從仿木紋、仿石紋、仿大理到幾何拼花，全品類磁磚解決方案。
            </p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 昇銓建材有限公司 所有權利reserved</p>
        <p style="margin-top: 12px;">
            網頁設計 by 刷個存在感
        </p>
    </footer>

    <script>
        function openMenu() {
            document.getElementById('sideMenu').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('sideMenu').classList.add('open');
            }, 10);
        }
        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('open');
            setTimeout(() => {
                document.getElementById('sideMenu').style.display = 'none';
            }, 400);
        }
    </script>
</body>
</html>
