<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羅曼石 — 產品系列 — 昇銓建材</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        @media (min-width: 768px) {
            .grid-2 { grid-template-columns: 1fr 1fr; }
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }
        .tile-card {
            position: relative;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text);
            display: block;
            transition: all 0.3s;
        }
        .tile-card:hover {
            border-color: var(--pink-deep);
            box-shadow: 0 4px 12px rgba(193,124,116,0.15);
        }
        .tile-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .back-link {
            display: inline-block;
            padding: 8px 16px;
            background: var(--pink-bg);
            color: var(--pink-dark);
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .back-link:hover {
            background: var(--pink-deep);
            color: var(--white);
        }
        .series-section {
            padding: 20px;
        }
        .series-section h2 {
            color: var(--pink-dark);
            font-size: 1.1rem;
        }
        .series-info {
            font-size: 0.82rem;
            color: var(--muted);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="star-cera-logo.png" alt="STAR CERA 昇銓建材">
        </div>
        <button class="hamburger" onclick="openMenu()">
            <span></span><span></span><span></span>
        </button>
    </header>

    <nav class="side-menu" id="sideMenu">
            <button class="close-btn" onclick="closeMenu()">&times;</button>
            <a href="index.html">首頁</a>
            <a href="about.html">關於昇銓</a>
            <a href="products.html">產品中心</a>
            <a href="careers.html">徵才專區</a>
            <a href="contact.html">聯絡我們</a>
        </nav>

    <section class="products-hero">
        <h1>羅曼石</h1>
        <p>紅螞蟻磁磚 完整系列 | 昇銓建材嚴選</p>
    </section>

    <div style="padding: 16px 20px;">
        <a class="back-link" href="products.html">← 返回產品中心</a>
    </div>

    <!-- 羅曼石 產品 -->
    <section class="series-section">
        <h2>羅曼石</h2>
        <p class="series-info">5 款產品</p>
        <div class="product-grid">
            <a class="tile-card" href="products/product0666.jpg" target="_blank">
                <img src="products/product0666.jpg" alt="羅曼石" loading="lazy">
            </a>
            <a class="tile-card" href="products/product0668.jpg" target="_blank">
                <img src="products/product0668.jpg" alt="羅曼石" loading="lazy">
            </a>
            <a class="tile-card" href="products/product0769.jpg" target="_blank">
                <img src="products/product0769.jpg" alt="羅曼石" loading="lazy">
            </a>
            <a class="tile-card" href="products/product0770.jpg" target="_blank">
                <img src="products/product0770.jpg" alt="羅曼石" loading="lazy">
            </a>
            <a class="tile-card" href="products/product0771.jpg" target="_blank">
                <img src="products/product0771.jpg" alt="羅曼石" loading="lazy">
            </a>
        </div>
    </section>

    <!-- 羅曼石 應用場景 -->
    <section class="series-section">
        <h2>羅曼石 應用場景</h2>
        <p class="series-info">3 張場景圖</p>
        <div class="scene-grid">
            <a class="tile-card" href="products/slider_no0101.jpg" target="_blank">
                <img src="products/slider_no0101.jpg" alt="羅曼石 場景" loading="lazy">
            </a>
            <a class="tile-card" href="products/slider_no0102.jpg" target="_blank">
                <img src="products/slider_no0102.jpg" alt="羅曼石 場景" loading="lazy">
            </a>
            <a class="tile-card" href="products/slider_no0103.jpg" target="_blank">
                <img src="products/slider_no0103.jpg" alt="羅曼石 場景" loading="lazy">
            </a>
        </div>
    </section>

    <footer style="text-align:center;padding:12px 20px;color:var(--muted);font-size:0.75rem;background:var(--pink-bg);">
        <p>雙北經銷商     昇銓建材有限公司</p>
    </footer>

    <script>
        function openMenu() {
            document.getElementById('sideMenu').classList.add('open');
        }
        function closeMenu() {
            document.getElementById('sideMenu').classList.remove('open');
        }
    </script>
</body>
</html>
